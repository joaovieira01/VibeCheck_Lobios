<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="assets/vibecheck-icon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>VibeCheck — Login</title>
  </head>
  <body data-page="login">
    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="index.html"
          ><span class="brand-mark"
            ><img src="assets/vibecheck-icon.svg" alt="" /></span
          ><span>Vibe<span>Check</span></span></a
        ><a class="btn btn-ghost btn-small" href="index.html">Voltar</a>
      </div>
    </header>
    <main class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="assets/vibecheck-icon.svg" alt="" /><strong
            >VibeCheck</strong
          >
        </div>
        <span class="eyebrow mono">área da equipe</span>
        <h1 id="auth-title">Bem-vindo de volta</h1>
        <p id="auth-copy" class="subtle">
          Entre para abrir o painel de análises e o histórico do projeto.
        </p>
        <form onsubmit="handleAuth(event)">
          <div id="name-wrap" class="field hidden">
            <label class="mono">NOME</label
            ><input type="text" placeholder="Seu nome" />
          </div>
          <div class="field">
            <label class="mono">E-MAIL</label
            ><input type="email" placeholder="voce@equipe.com" required />
          </div>
          <div class="field">
            <label class="mono">SENHA</label
            ><input type="password" placeholder="••••••••" required />
          </div>
          <input type="hidden" id="auth-mode" value="login" /><button
            class="btn btn-primary"
            id="auth-submit"
            type="submit"
          >
            Entrar
          </button>
          <div class="divider"><span class="mono">OU</span></div>
          <a class="btn btn-ghost" href="analise.html"
            >Continuar para análise</a
          >
        </form>
        <div class="auth-switch" id="switch-note">
          Ainda não tem conta?
          <button type="button" onclick="toggleAuth('signup')">
            Criar conta grátis
          </button>
        </div>
      </div>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
