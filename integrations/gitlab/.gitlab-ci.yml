stages:
  - security

variables:
  VIBECHECK_REPO_URL: "https://github.com/joaovieira01/VibeCheck_Lobios.git"
  VIBECHECK_FAIL_ON: "Alta"

vibecheck:
  stage: security
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - VIBECHECK_DIR="${CI_BUILDS_DIR}/vibecheck-${CI_JOB_ID}"
    - git clone --depth 1 "$VIBECHECK_REPO_URL" "$VIBECHECK_DIR"
    - python "$VIBECHECK_DIR/backend/scripts/scan_repo.py" "$CI_PROJECT_DIR" --format sarif --fail-on "$VIBECHECK_FAIL_ON" > vibecheck.sarif
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - vibecheck.sarif
