services:
  mysql:
    image: mysql:8.4
    container_name: vibecheck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${VIBECHECK_DB_NAME:-vibecheck}
      MYSQL_USER: ${VIBECHECK_DB_USER:-vibecheck_user}
      MYSQL_PASSWORD: ${VIBECHECK_DB_PASSWORD:-CHANGE_THIS_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - vibecheck_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibecheck-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      VIBECHECK_DB_ENGINE: mysql
      VIBECHECK_DB_HOST: mysql
      VIBECHECK_DB_PORT: 3306
      VIBECHECK_DB_NAME: ${VIBECHECK_DB_NAME:-vibecheck}
      VIBECHECK_DB_USER: ${VIBECHECK_DB_USER:-vibecheck_user}
      VIBECHECK_DB_PASSWORD: ${VIBECHECK_DB_PASSWORD:-CHANGE_THIS_PASSWORD}
      VIBECHECK_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      VIBECHECK_FRONTEND_URL: http://localhost:5173
      VIBECHECK_SEED_DEMO_USER: "false"
      VIBECHECK_RATE_LIMIT: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements-dev.txt &&
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/srv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibecheck-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  vibecheck_mysql_data:
  frontend_node_modules:
